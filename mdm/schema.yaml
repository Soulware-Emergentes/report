- title: "Capítulo I: Introducción"
  alias: "intro"
  children:
    - title: "Startup Profile"
      alias: "startup"
      children:
        - title: "Descripción de la Startup"
          alias: "descripcion"
        - title: "Perfiles de integrantes del equipo"
          alias: "perfiles"
    - title: "Solution Profile"
      alias: "solution"
      children:
        - title: "Antecedentes y problemática"
          alias: "antecedentes"
        - title: "Lean UX Process"
          alias: "lean-ux"
          children:
            - title: "Lean UX Problem Statements"
              alias: "problems"
              skip_after: false
            - title: "Lean UX Assumptions"
              alias: "assumptions"
            - title: "Lean UX Hypothesis Statements"
              alias: "hypothesis"
              skip_after: false
            - title: "Lean UX Canvas"
              alias: "canvas"
    - title: "Segmentos objetivo"
      alias: "segmentos"

- title: "Capítulo II: Requirements Elicitation & Analysis"
  alias: "elicitation"
  children:
    - title: "Competidores"
      children:
        - title: "Análisis competitivo"
          alias: "analisis"
        - title: "Estrategias y tácticas frente a competidores"
          alias: "estrategias"
    - title: "Entrevistas"
      children:
        - title: "Diseño de entrevistas"
          custom_id: "needfinding-diseno"
          alias: "diseno"
        - title: "Registro de entrevistas"
          custom_id: "needfinding-registro"
          alias: "registro"
        - title: "Análisis de entrevistas"
          alias: "analisis"
    - title: "Needfinding"
      children:
        - title: "User Personas"
          alias: "personas"
        - title: "User Task Matrix"
          alias: "task-matrix"
        - title: "Empathy Mapping"
          alias: "empathy"
        - title: "As-is Scenario Mapping"
          alias: "as-is"
    - title: "Ubiquitous Language"
      alias: "ubiquitous_language"

- title: "Capítulo III: Requirements Specification"
  alias: "specification"
  children:
    - title: "To-Be Scenario Mapping"
      alias: "to-be"
    - title: "User Stories"
    - title: "Impact Mapping"
    - title: "Product Backlog"
      alias: "backlog"

- title: "Capítulo IV: Strategic-Level Software Design"
  alias: "strategic-design"
  children:
    - title: "Strategic-Level Attribute-Driven Design"
      alias: "add"
      children:
        - title: "Design Purpose"
          alias: "purpose"
        - title: "Attribute-Driven Design Inputs"
          alias: "inputs"
          has_intro: true
          skip_after: false
          children:
            - title: "Primary Functionality (Primary User Stories)"
              alias: "functionality"
            - title: "Quality attribute Scenarios"
              alias: "scenarios"
            - title: "Constraints"
        - title: "Architectural Drivers Backlog"
          alias: "drivers"
        - title: "Architectural Design Decisions"
          alias: "decisions"
        - title: "Quality Attribute Scenario Refinements"
          alias: "refinements"
    - title: "Strategic-Level Domain-Driven Design"
      alias: "ddd"
      children:
        - title: "EventStorming"
        - title: "Candidate Context Discovery"
          alias: "discovery"
          skip_after: false
        - title: "Domain Message Flows Modeling"
          alias: "message-flows"
        - title: "Bounded Context Canvases"
          alias: "bc-canvases"
        - title: "Context Mapping"
          alias: "mapping"
    - title: "Software Architecture"
      alias: "architecture"
      children:
        - title: "Software Architecture System Landscape Diagram"
          alias: "landscape"
        - title: "Software Architecture Context Level Diagrams"
          alias: "context-level"
        - title: "Software Architecture Container Level Diagrams"
          alias: "container-level"
        - title: "Software Architecture Deployment Diagrams"
          alias: "deployment"

# Capítulo VII is out of scope until its hito: the statement's hito breakdown
# (page 31, "Aspectos a incluir") asks for it from TB2 (Semana 12) onward.
# Uncomment it when that hito comes up.
#
# Capítulo V has one bounded context per code module. The "alias" IS the
# module's short name (that's what names the folder), and the alias prefix in
# each custom_id keeps anchors unique across contexts. A layer joins its
# context's children once that layer is written, in the statement's order:
# Domain, Interface, Application, Infrastructure, Component Level, Code Level.
- title: "Capítulo V: Tactical-Level Software Design"
  alias: "tactical-design"
  children:
    - title: "Bounded Context: Monitoring"
      alias: "monitoring"
      has_intro: true
      skip_after: false
      children:
        - title: "Domain Layer"
          custom_id: "monitoring-domain-layer"
          alias: "domain-layer"
        - title: "Interface Layer"
          custom_id: "monitoring-interface-layer"
          alias: "interface-layer"
        - title: "Application Layer"
          custom_id: "monitoring-application-layer"
          alias: "application-layer"
        - title: "Infrastructure Layer"
          custom_id: "monitoring-infrastructure-layer"
          alias: "infrastructure-layer"
        - title: "Bounded Context Software Architecture Component Level Diagrams"
          custom_id: "monitoring-component-level"
          alias: "component-level"
        - title: "Bounded Context Software Architecture Code Level Diagrams"
          custom_id: "monitoring-code-level"
          alias: "code-level"
          children:
            - title: "Bounded Context Domain Layer Class Diagrams"
              custom_id: "monitoring-class-diagram"
              alias: "class-diagram"
            - title: "Bounded Context Database Design Diagram"
