# Beyond "Videos de Exposiciones" below (explicitly required by page 3:
# "el enlace privado del video debe incluirse en el Document Report, dentro
# de un anexo titulado (Videos de Exposiciones)"), further annex content is
# open-ended (statement page 8): "tablas, documentos, gráficos, u otros
# elementos que por su extensión o grado de importancia ameriten aparecer en
# esta sección", each starting on a new page and titled with a letter
# ("Ejemplo: Anexo A, Anexo B, etc."). Add a child per extra annex as the
# team identifies material for it, e.g.:
#    - title: "Anexo B: <what it is>"
#      alias: "Anexo B"
- title: "Anexos"
  children:
    - title: "Videos de Exposiciones"
      alias: "Anexo A"
