- title: "Carátula"
  skip_title: true

- title: "Registro de Versiones del Informe"
  alias: "versiones"

- title: "Project Report Collaboration Insights"
  alias: "insights"

- title: "Contenido"
  alias: "INDEX"

- title: "Student Outcome"
  alias: "outcome"

- title: "Capítulo I: Introducción"
  alias: "intro"
  children:
    - title: "Startup Profile"
      alias: "startup"
      children:
        - title: "Descripción de la Startup"
          alias: "descripcion"
        - title: "Perfiles de integrantes del equipo"
          alias: "perfiles"
    - title: "Solution Profile"
      alias: "solution"
      children:
        - title: "Antecedentes y problemática"
          alias: "antecedentes"
        - title: "Lean UX Process"
          alias: "lean-ux"
          children:
            - title: "Lean UX Problem Statements"
              alias: "problems"
            - title: "Lean UX Assumptions"
              alias: "assumptions"
            - title: "Lean UX Hypothesis Statements"
              alias: "hypothesis"
            - title: "Lean UX Canvas"
              alias: "canvas"
    - title: "Segmentos objetivo"
      alias: "segmentos"

- title: "Capítulo II: Requirements Elicitation & Analysis"
  alias: "elicitation"
  children:
    - title: "Competidores"
      children:
        - title: "Análisis competitivo"
          alias: "analisis"
        - title: "Estrategias y tácticas frente a competidores"
          alias: "estrategias"
    - title: "Entrevistas"
      children:
        - title: "Diseño de entrevistas"
          custom_id: "needfinding-diseno"
          alias: "diseno"
        - title: "Registro de entrevistas"
          custom_id: "needfinding-registro"
          alias: "registro"
        - title: "Análisis de entrevistas"
          alias: "analisis"
    - title: "Needfinding"
      children:
        - title: "User Personas"
          alias: "personas"
        - title: "User Task Matrix"
          alias: "task-matrix"
        - title: "Empathy Mapping"
          alias: "empathy"
        - title: "As-is Scenario Mapping"
          alias: "as-is"
    - title: "Ubiquitous Language"
      alias: "glossary"

- title: "Capítulo III: Requirements Specification"
  alias: "specification"
  children:
    - title: "To-Be Scenario Mapping"
      alias: "to-be"
    - title: "User Stories"
    - title: "Impact Mapping"
    - title: "Product Backlog"
      alias: "backlog"

- title: "Capítulo IV: Strategic-Level Software Design"
  alias: "strategic-design"
  children:
    - title: "Strategic-Level Attribute-Driven Design"
      alias: "add"
      children:
        - title: "Design Purpose"
          alias: "purpose"
        - title: "Attribute-Driven Design Inputs"
          alias: "inputs"
          children:
            - title: "Primary Functionality (Primary User Stories)"
              alias: "functionality"
            - title: "Quality attribute Scenarios"
              alias: "scenarios"
            - title: "Constraints"
        - title: "Architectural Drivers Backlog"
          alias: "drivers"
        - title: "Architectural Design Decisions"
          alias: "decisions"
        - title: "Quality Attribute Scenario Refinements"
          alias: "refinements"
    - title: "Strategic-Level Domain-Driven Design"
      alias: "ddd"
      children:
        - title: "EventStorming"
        - title: "Candidate Context Discovery"
          alias: "discovery"
        - title: "Domain Message Flows Modeling"
          alias: "message-flows"
        - title: "Bounded Context Canvases"
          alias: "bc-canvases"
        - title: "Context Mapping"
          alias: "mapping"
    - title: "Software Architecture"
      alias: "architecture"
      children:
        - title: "Software Architecture System Landscape Diagram"
          alias: "landscape"
        - title: "Software Architecture Context Level Diagrams"
          alias: "context-level"
        - title: "Software Architecture Container Level Diagrams"
          alias: "container-level"
        - title: "Software Architecture Deployment Diagrams"
          alias: "deployment"

